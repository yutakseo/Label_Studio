services:
  label-studio:
    build:
      context: ./label_studio
      dockerfile: Dockerfile
    image: label-studio:local
    container_name: label-studio
    ports:
      - "8080:8080"
    volumes:
      - ./label_studio/data:/label-studio/data
      # Create files as the host user before startup; do not let Docker
      # automatically create a root-owned directory.
      - type: bind
        source: ./files
        target: /label-studio/data/files
        bind:
          create_host_path: false
      - ./label_studio/draft_preview:/label-studio/label_studio/draft_preview:ro
      - ./label_studio/third-party/mask_cleanup:/label-studio/label_studio/mask_cleanup:ro
      - ./label_studio/third-party/gaussian_mask:/label-studio/label_studio/gaussian_mask:ro
      - ./label_studio/third-party/u_net_labeller:/label-studio/label_studio/u_net_labeller:ro
      - ./label_studio/overrides/358.js:/label-studio/web/dist/apps/labelstudio/358.js:ro
      - ./label_studio/overrides/runtime.js:/label-studio/web/dist/apps/labelstudio/runtime.js:ro
    environment:
      PYTHONPATH: /label-studio:/label-studio/label_studio
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      UNET_DEVICE: "cuda:0"
      UNET_BATCH_SIZE: "16"
      LABEL_STUDIO_BASE_DATA_DIR: /label-studio/data
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped
